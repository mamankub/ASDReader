name: Printer experiment

# Does a second print queue on Windows' own "Microsoft Print To PDF" driver work on a runner, and does a
# Thai page printed through it come out as Thai text? Manual runs only.
on:
  workflow_dispatch:
  push:
    branches: [feat/asdreader-installer-release]
    paths: ['.github/workflows/printer-experiment.yml']

permissions:
  contents: read

jobs:
  experiment:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: What the runner has
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object OsName, OsVersion, WindowsEditionId | Format-List
          Get-WindowsOptionalFeature -Online | Where-Object FeatureName -match 'PDF|Print' | Format-Table FeatureName, State
          Get-PrinterDriver | Format-Table Name
          Get-Printer | Format-Table Name, DriverName, PortName
          Get-Service Spooler | Format-Table Name, Status
          Test-Path "$env:windir\inf\ntprint.inf"
          Get-ChildItem C:\Windows\Fonts\tahoma*.ttf, C:\Windows\Fonts\leelawui*.ttf, C:\Windows\Fonts\angsa*.ttf -ErrorAction SilentlyContinue | Select-Object Name
      - name: Add the queue the way the installer would
        shell: pwsh
        run: |
          $rundll = "$env:windir\System32\rundll32.exe"
          & $rundll printui.dll,PrintUIEntry /if /b "ASD PDF Printer" /f "$env:windir\inf\ntprint.inf" /r "PORTPROMPT:" /m "Microsoft Print To PDF"
          "rundll32 exit: $LASTEXITCODE"
          Start-Sleep 5
          Get-Printer | Format-Table Name, DriverName, PortName
      - name: Print a Thai page through a file port
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'thai-test.pdf'
          Remove-Item $out -ErrorAction SilentlyContinue
          Add-PrinterPort -Name $out
          Add-Printer -Name 'ASD PDF Printer (test)' -DriverName 'Microsoft Print To PDF' -PortName $out
          Add-Type -AssemblyName System.Drawing
          $lines = @('เอกสารภาษาไทย เจ้าของบ้าน ไฟฟ้า ปั้น น้ำ ญู ฎุ ที่ตั้ง', 'ต.เกิ้ง อ.เมืองมหาสารคาม จ.มหาสารคาม', 'ASDReader 0.13 ทดสอบการพิมพ์')
          $fonts = @('Tahoma', 'Leelawadee UI', 'Angsana New')
          $pd = New-Object System.Drawing.Printing.PrintDocument
          $pd.PrinterSettings.PrinterName = 'ASD PDF Printer (test)'
          $pd.add_PrintPage({
            param($s, $e)
            $y = 100
            foreach ($name in $fonts) {
              $font = New-Object System.Drawing.Font($name, 20)
              foreach ($l in $lines) { $e.Graphics.DrawString($l, $font, [System.Drawing.Brushes]::Black, 100, $y); $y += 50 }
              $y += 30
            }
            $e.HasMorePages = $false
          })
          $pd.Print()
          for ($i = 0; $i -lt 40 -and -not (Test-Path $out); $i++) { Start-Sleep 1 }
          Start-Sleep 3
          Get-Item $out | Format-List Name, Length
          Copy-Item $out "$env:GITHUB_WORKSPACE\thai-test.pdf"
      - name: Remove the queue again
        if: always()
        shell: pwsh
        run: |
          & "$env:windir\System32\rundll32.exe" printui.dll,PrintUIEntry /dl /n "ASD PDF Printer"
          Start-Sleep 3
          Get-Printer | Format-Table Name
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: printer-experiment
          path: thai-test.pdf
          if-no-files-found: warn
