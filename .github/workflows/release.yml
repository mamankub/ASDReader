name: Release

# Build candidates from an explicit ref. Verify artifacts, tag this exact commit,
# then publish the GitHub Release as a separate owner-authorized step.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Cargo.toml version (empty: use manifest; never rewrites sources)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04, artifact: linux-x86_64 }
          - { name: Windows x64 portable, os: windows-latest, artifact: windows-x64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
      ASDREADER_REQUIRE_THAI: "1"
      PDFCRAFT_SYSTEM_FONTS: "0"
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: asdreader-release-${{ matrix.artifact }}
          cache-on-failure: true
      - name: Check version and font hashes
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          manifest = pathlib.Path('Cargo.toml').read_text()
          section = manifest.split('[workspace.package]', 1)[1].split('\n[', 1)[0]
          version = re.search(r'^version = "([^"]+)"$', section, re.M).group(1)
          expected = os.environ.get('EXPECTED_VERSION', '')
          if expected and expected != version:
              raise SystemExit(f'Expected {expected}, Cargo.toml has {version}')
          fonts = pathlib.Path(os.environ['CRAFT_FONTS_DIR'])
          count = 0
          for line in (fonts / 'fonts/manifest.txt').read_text().splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              fields = [part.strip() for part in line.split(' | ')]
              digest = hashlib.sha256((fonts / fields[2]).read_bytes()).hexdigest()
              if digest != fields[6]:
                  raise SystemExit(f'Font hash mismatch: {fields[2]}')
              count += 1
          print(f'ASDReader {version}: verified {count} font hashes')
          PY
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Verify model downloads before the application build
        shell: bash
        run: cargo xtask models assets/models
      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh --formats tar
      - name: Build Windows portable archive (unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64 -PortableOnly
      - name: Thai regression and asset checks
        if: runner.os == 'Linux'
        env:
          PDFCRAFT_MODELS: ${{ github.workspace }}/assets/models
        run: |
          cargo test --release --locked -p pdfcraft-fonts -p pdfcraft-edit --lib
          cargo test --release --locked -p pdfcraft-engine --test it thai
          cargo test --release --locked -p pdfcraft-ocr --lib
          cargo xtask assets
          cargo xtask layers
      - name: Record candidate checksums and source commit
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          printf '%s\n' "$PDFCRAFT_BUILD_SHA" > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asdreader-${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
