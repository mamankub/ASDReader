name: Release

# Build candidates from an explicit ref. Verify artifacts, tag this exact commit,
# then publish the GitHub Release as a separate owner-authorized step.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Expected Cargo.toml version (empty: use manifest; never rewrites sources)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ github.repository_owner == 'mamankub' && github.actor == 'mamankub' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON('{"ubuntu-latest":["self-hosted","Linux","X64","asd-ci","ubuntu-24.04"],"ubuntu-24.04":["self-hosted","Linux","X64","asd-ci","ubuntu-24.04"],"ubuntu-22.04":["self-hosted","Linux","X64","asd-ci","ubuntu-22.04"],"windows-latest":["self-hosted","Windows","X64","asd-ci"],"windows-2022":["self-hosted","Windows","X64","asd-ci"],"windows-2025":["self-hosted","Windows","X64","asd-ci"]}')[matrix.os] }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, os: ubuntu-22.04, artifact: linux-x86_64 }
          - { name: Windows x64 installer and portable, os: windows-latest, artifact: windows-x64 }
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      ASDESIGN_FONTS_DIR: ${{ github.workspace }}/asdesign-fonts
      ASDESIGN_FONTS_REQUIRED: "1"
      ASDREADER_REQUIRE_THAI: "1"
      ASDREADER_SYSTEM_FONTS: "0"
      ASDREADER_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mamankub/asdesign-fonts
          ref: c76dcbc93b13d3b6981c12602bc545ea7ec3e67a
          path: asdesign-fonts
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: asdreader-release-${{ matrix.artifact }}
          cache-on-failure: true
      - name: Check version and font hashes
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re
          manifest = pathlib.Path('Cargo.toml').read_text()
          section = manifest.split('[workspace.package]', 1)[1].split('\n[', 1)[0]
          version = re.search(r'^version = "([^"]+)"$', section, re.M).group(1)
          expected = os.environ.get('EXPECTED_VERSION', '')
          if expected and expected != version:
              raise SystemExit(f'Expected {expected}, Cargo.toml has {version}')
          fonts = pathlib.Path(os.environ['ASDESIGN_FONTS_DIR'])
          count = 0
          for line in (fonts / 'fonts/manifest.txt').read_text().splitlines():
              if not line.strip() or line.lstrip().startswith('#'):
                  continue
              fields = [part.strip() for part in line.split(' | ')]
              digest = hashlib.sha256((fonts / fields[2]).read_bytes()).hexdigest()
              if digest != fields[6]:
                  raise SystemExit(f'Font hash mismatch: {fields[2]}')
              count += 1
          print(f'ASDReader {version}: verified {count} font hashes')
          PY
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - name: Verify model downloads before the application build
        shell: bash
        run: cargo xtask models assets/models
      - name: Build Linux archive
        if: runner.os == 'Linux'
        run: bash packaging/linux/package.sh --formats tar
      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build Windows installer wizard (MSI) and portable archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # The private ASDReader code-signing certificate (packaging/windows/trust/README-TH.md). Without
          # it the files are left unsigned (sign.ps1 warns).
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Print Thai through the ASD PDF Printer (queue, receiver and saved file)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/test-pdf-printer.ps1 -App "$PWD/target/x86_64-pc-windows-msvc/release/ASDReader.exe" -Cli "$PWD/target/x86_64-pc-windows-msvc/release/asdreader-cli.exe"
      - name: Check the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HAVE_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
          # SHA-1 thumbprint of the code-signing certificate issued by the ASDReader Root CA.
          EXPECTED_SIGNER: 0015645D64A0B4295350C920BCC9CBF6A032DBCE
        run: |
          if ($env:HAVE_CERT -ne 'true') { Write-Output '::warning::no signing certificate: the Windows files are unsigned'; exit 0 }
          $files = @(Get-ChildItem dist/release -Filter *.msi) + @(Get-Item target/windows-package/x64/ASDReader.exe, target/windows-package/x64/asdreader-cli.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            # The runner does not trust the private root, so the status is UnknownError/NotTrusted
            # there; what must hold is a signature made by our certificate, with a timestamp.
            if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER) { throw "$($f.Name) is not signed by the ASDReader certificate: $($sig.Status) $($sig.SignerCertificate.Thumbprint)" }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name) has no timestamp" }
            Write-Output "signed ok: $($f.Name) by $($sig.SignerCertificate.Subject), status $($sig.Status)"
          }
      - name: Thai regression and asset checks
        if: runner.os == 'Linux'
        env:
          ASDREADER_MODELS: ${{ github.workspace }}/assets/models
        run: |
          cargo test --release --locked -p asdreader-fonts -p asdreader-edit --lib
          cargo test --release --locked -p asdreader-engine --test it thai
          cargo test --release --locked -p asdreader-ocr --lib
          cargo xtask assets
          cargo xtask layers
      - name: Record candidate checksums and source commit
        shell: bash
        run: |
          set -euo pipefail
          cd dist/release
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.msi' \) -exec sha256sum {} + > SHA256SUMS.txt
          test -s SHA256SUMS.txt
          printf '%s\n' "$ASDREADER_BUILD_SHA" > SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asdreader-${{ matrix.artifact }}
          path: dist/release/*
          if-no-files-found: error
