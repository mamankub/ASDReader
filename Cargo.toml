[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["vendor"]
default-members = ["crates/*", "apps/asdreader", "apps/asdreader-cli", "xtask"]

[workspace.package]
version = "0.13.2"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/mamankub/ASDReader"

[workspace.dependencies]
# Shared frontend components; engines remain independent of egui.
craft-ui = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "5c874d51eeb3de70e735c8ce87a59a7dedd47675", features = ["serde"] }
# Quit the macOS way (#1136): ⌘Q asks about unsaved changes, and closing quits through `terminate:`.
craft-quit = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "f58bc1a3df490992d633393d0898af0588ce882c" }
# Shared system spooler; document composition remains in asdreader-print.
craft-print = { git = "https://github.com/storytold/craft-libs", version = "0.1.0", rev = "666c358065261a2816b376fa3bb10538dbf53040" }
# Whether a path stored in a document may be opened (GoToR link targets).
craft-docpath = { version = "0.1.0", git = "https://github.com/storytold/craft-libs", rev = "82a24b006eefa036b43c09a67fb9a3fbd17ffe63" }
# internal
asdreader-geom = { path = "crates/geom", version = "0.13.2" }
asdreader-filters = { path = "crates/filters", version = "0.13.2" }
asdreader-cos = { path = "crates/cos", version = "0.13.2" }
asdreader-crypt = { path = "crates/crypt", version = "0.13.2" }
asdreader-organize = { path = "crates/organize", version = "0.13.2" }
asdreader-measure = { path = "crates/measure", version = "0.13.2" }
asdreader-annot = { path = "crates/annot", version = "0.13.2" }
asdreader-audit = { path = "crates/audit", version = "0.13.2" }
asdreader-fonts = { path = "crates/fonts", version = "0.13.2" }
asdreader-model = { path = "crates/model", version = "0.13.2" }
asdreader-content = { path = "crates/content", version = "0.13.2" }
asdreader-redact = { path = "crates/redact", version = "0.13.2" }
asdreader-print = { path = "crates/print", version = "0.13.2" }
asdreader-xfdf = { path = "crates/xfdf", version = "0.13.2" }
asdreader-sign = { path = "crates/sign", version = "0.13.2" }
asdreader-optimize = { path = "crates/optimize", version = "0.13.2" }
asdreader-a11y = { path = "crates/a11y", version = "0.13.2" }
asdreader-oracle = { path = "crates/oracle", version = "0.13.2" }
asdreader-testkit = { path = "crates/testkit", version = "0.13.2" }
asdreader-ocr = { path = "crates/ocr", version = "0.13.2" }
asdreader-js = { path = "crates/js", version = "0.13.2" }
asdreader-compare = { path = "crates/compare", version = "0.13.2" }
asdreader-preflight = { path = "crates/preflight", version = "0.13.2" }
asdreader-export = { path = "crates/export", version = "0.13.2" }
asdreader-edit = { path = "crates/edit", version = "0.13.2" }
asdreader-create = { path = "crates/create", version = "0.13.2" }
asdreader-forms = { path = "crates/forms", version = "0.13.2" }
asdreader-xfa = { path = "crates/xfa", version = "0.13.2" }
asdreader-render = { path = "crates/render", version = "0.13.2" }
asdreader-engine = { path = "crates/engine", version = "0.13.2" }
asdreader-platform = { path = "crates/platform", version = "0.13.2" }
asdreader-ui-egui = { path = "crates/ui-egui", version = "0.13.2" }
asdreader-automation = { path = "crates/automation", version = "0.13.2", default-features = false }

# pdf
hayro = "0.7.1"
hayro-syntax = "0.7.2"
lopdf = "0.45"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
weezl = "0.2"

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
log = "0.4"
kurbo = "0.13"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

# testing
proptest = "1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# `"*"` matches every non-workspace package: crates.io dependencies and the
# vendored crates under `vendor/` (excluded from the workspace). Dependencies
# carry no debug info and our own crates only line tables: backtraces and
# panics still show file and line, while test binaries and the target dir stay
# small (each UI test binary had a 500-600 MB PDB on Windows, #454).
[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.low-disk]
inherits = "dev"
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1

# Vendored, patched third-party crates (see vendor/README.md). Each patch is meant to go upstream.
# The Windows print path's PrintTicket builder starts from the user's printer settings
# (vendor/winprint; vendor/README.md), so a job prints at the resolution Printing Preferences set.
[patch."https://github.com/storytold/winprint.rs"]
winprint = { path = "vendor/winprint" }

[patch.crates-io]
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro = { path = "vendor/hayro" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
lopdf = { path = "vendor/lopdf" }
winit = { path = "vendor/winit" }
egui-wgpu = { path = "vendor/egui-wgpu" }
vello_common = { path = "vendor/vello_common" }
