[package]
name = "asdreader-cli"
description = "ASDReader command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "asdreader-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
asdreader-render = { workspace = true }
serde_json = { workspace = true }
asdreader-engine = { workspace = true }
asdreader-audit = { workspace = true }
asdreader-cos = { workspace = true }
asdreader-preflight = { workspace = true }
asdreader-automation = { workspace = true }
asdreader-platform = { workspace = true }
base64 = "0.22"

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs; already a dependency of the engine.
png = "0.18"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for asdreader-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`asdreader-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["asdreader-automation/mcp"]
