[package]
name = "asdreader-engine"
description = "ASDReader engine façade: session, documents, command/tool catalogue"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
asdesign-docpath = { workspace = true }
asdreader-measure = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
asdreader-render = { workspace = true }
asdreader-cos = { workspace = true }
asdreader-organize = { workspace = true }
asdreader-annot = { workspace = true }
asdreader-forms = { workspace = true }
asdreader-xfa = { workspace = true }
asdreader-edit = { workspace = true }
asdreader-audit = { workspace = true }
asdreader-redact = { workspace = true }
asdreader-print = { workspace = true }
asdreader-xfdf = { workspace = true }
asdreader-sign = { workspace = true }
asdreader-optimize = { workspace = true }
asdreader-a11y = { workspace = true }
asdreader-ocr = { workspace = true }
asdreader-js = { workspace = true }
asdreader-compare = { workspace = true }
asdreader-preflight = { workspace = true }
asdreader-export = { workspace = true }
asdreader-fonts = { workspace = true }
asdreader-create = { workspace = true }
asdreader-model = { workspace = true }
asdreader-geom = { workspace = true }
thiserror = { workspace = true }
png = "0.18"
# Already in the graph (through image and asdreader-create): image's TiffEncoder can't set the
# resolution or the compression of an exported page.
tiff = "0.11"
# Already in the graph (url and idna through webbrowser, icu_properties through boa): they show
# the host of a document's link the way the browser reads it (links::display_host).
url = "2.5"
idna = "1.1"
icu_properties = "2.3"
unicode-segmentation = "1.13"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Already in the graph through lopdf; used only for the local UTC offset ("today"). The workspace
# entry is std-only; this target adds `clock` for `chrono::Local::now`.
chrono = { workspace = true, features = ["clock"] }

[dev-dependencies]
asdreader-testkit = { workspace = true }
